<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cosmic Quest — Space Quiz</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7ff;
      --surface: rgba(255, 255, 255, .84);
      --surface-strong: #fff;
      --text: #172044;
      --muted: #687092;
      --line: #e3e6f5;
      --primary: #6259e8;
      --primary-dark: #4f47cb;
      --accent: #ffb84d;
      --correct: #14b878;
      --wrong: #f25c68;
      --shadow: 0 24px 70px rgba(58, 61, 117, .14);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #10142d;
        --surface: rgba(27, 32, 64, .88);
        --surface-strong: #1c2143;
        --text: #f2f4ff;
        --muted: #aeb5d3;
        --line: #343a66;
        --shadow: 0 24px 70px rgba(0, 0, 0, .35);
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 15%, rgba(130, 106, 255, .28), transparent 26rem),
        radial-gradient(circle at 90% 85%, rgba(255, 184, 77, .2), transparent 24rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    .app { width: min(100%, 620px); }
    .shell {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 24px 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.02em; }
    .brand-mark {
      display: grid; place-items: center; width: 34px; height: 34px;
      border-radius: 11px; background: linear-gradient(135deg, #7c6dff, #4d47d8);
      color: white; font-size: 18px; box-shadow: 0 8px 18px rgba(98, 89, 232, .3);
    }
    .score-pill {
      display: flex; align-items: center; gap: 6px; padding: 7px 12px;
      border-radius: 99px; background: rgba(255, 184, 77, .16); color: var(--text);
      font-size: 13px; font-weight: 750;
    }
    .score-pill b { color: #d48100; }

    .progress-wrap { padding: 0 24px 22px; }
    .progress-meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .progress-track { height: 8px; overflow: hidden; border-radius: 99px; background: var(--line); }
    .progress-bar { width: 10%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #776aff, #a19aff); transition: width .45s ease; }

    .content {
      position: relative;
      margin: 0 14px 14px;
      padding: 26px 24px 28px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--primary) 30%, var(--line));
      border-radius: 20px;
      background:
        linear-gradient(rgba(98, 89, 232, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(98, 89, 232, .045) 1px, transparent 1px),
        color-mix(in srgb, var(--surface-strong) 78%, transparent);
      background-size: 26px 26px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .04), inset 0 0 40px rgba(98, 89, 232, .08);
    }
    .content::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(135deg, rgba(255, 255, 255, .12), transparent 35%, transparent 70%, rgba(98, 89, 232, .08));
    }
    .console-label {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .console-label::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--correct);
      box-shadow: 0 0 0 4px rgba(20, 184, 120, .12), 0 0 12px rgba(20, 184, 120, .65);
    }
    .eyebrow { position: relative; margin: 0 0 8px; color: var(--primary); font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { position: relative; margin: 0 0 26px; max-width: 520px; font-size: clamp(1.55rem, 4vw, 2.15rem); line-height: 1.15; letter-spacing: -.04em; }
    .options { display: grid; gap: 11px; }
    .option {
      display: flex; align-items: center; gap: 13px; width: 100%; padding: 14px 16px;
      border: 1px solid var(--line); border-radius: 15px; color: var(--text);
      background: color-mix(in srgb, var(--surface-strong) 88%, transparent); text-align: left; font: inherit; cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
    }
    .option:hover:not(:disabled) { transform: translateY(-2px); border-color: #aaa4ff; box-shadow: 0 8px 18px rgba(98, 89, 232, .1); }
    .option:focus-visible, .primary:focus-visible { outline: 3px solid rgba(98, 89, 232, .35); outline-offset: 3px; }
    .letter {
      display: grid; place-items: center; flex: 0 0 29px; height: 29px;
      border-radius: 9px; background: #f0efff; color: var(--primary); font-weight: 800; font-size: 13px;
    }
    @media (prefers-color-scheme: dark) { .letter { background: #302d67; } }
    .option.correct { border-color: var(--correct); background: rgba(20, 184, 120, .12); }
    .option.correct .letter { background: var(--correct); color: white; }
    .option.wrong { border-color: var(--wrong); background: rgba(242, 92, 104, .1); animation: shake .42s ease; }
    .option.wrong .letter { background: var(--wrong); color: white; }
    .option:disabled { cursor: default; }

    .feedback { position: relative; min-height: 27px; padding: 15px 2px 0; font-weight: 700; }
    .feedback.correct { color: var(--correct); }
    .feedback.wrong { color: var(--wrong); }
    .next-row { position: relative; display: flex; justify-content: flex-end; padding-top: 4px; }
    .primary {
      border: 0; border-radius: 13px; padding: 12px 18px; color: white;
      background: linear-gradient(135deg, var(--primary), #8278ff); font: inherit; font-weight: 800;
      cursor: pointer; box-shadow: 0 9px 20px rgba(98, 89, 232, .25);
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .primary:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(98, 89, 232, .34); }

    .results { padding: 34px 24px 36px; text-align: center; }
    .results-emoji { display: block; margin-bottom: 10px; font-size: 64px; animation: float 3s ease-in-out infinite; }
    .results h2 { margin: 0; font-size: 2rem; letter-spacing: -.04em; }
    .results p { margin: 10px auto 24px; max-width: 390px; color: var(--muted); }
    .score-card { display: inline-flex; align-items: baseline; gap: 7px; margin-bottom: 24px; padding: 14px 22px; border-radius: 18px; background: rgba(98, 89, 232, .11); }
    .score-card strong { color: var(--primary); font-size: 2.3rem; line-height: 1; }
    .score-card span { color: var(--muted); font-weight: 700; }
    .review-heading { margin: 28px 0 12px; font-size: 1.05rem; text-align: left; }
    .answer-review { display: grid; gap: 10px; margin: 0 0 24px; padding: 0; list-style: none; text-align: left; }
    .review-item { padding: 14px 15px; border: 1px solid var(--line); border-left: 4px solid var(--muted); border-radius: 14px; background: color-mix(in srgb, var(--surface-strong) 88%, transparent); }
    .review-item.correct { border-left-color: var(--correct); }
    .review-item.incorrect { border-left-color: var(--wrong); }
    .review-status { display: block; margin-bottom: 5px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .review-item.correct .review-status { color: var(--correct); }
    .review-item.incorrect .review-status { color: var(--wrong); }
    .review-question { margin: 0 0 8px; font-weight: 800; }
    .review-answer { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
    .review-answer strong { color: var(--text); }
    .hidden { display: none; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 50% { transform: translateX(7px); } 75% { transform: translateX(-4px); } }
    @keyframes float { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="app">
    <section class="shell" aria-live="polite">
      <div id="quiz-view">
        <header class="topbar">
          <div class="brand"><span class="brand-mark">✦</span><span>Cosmic Quest</span></div>
          <div class="score-pill">⭐ Score <b id="score">0</b></div>
        </header>
        <div class="progress-wrap">
          <div class="progress-meta"><span id="question-count">Question 1 of 10</span><span id="percent">10%</span></div>
          <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="1">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
        </div>
        <div class="content">
          <div class="console-label" aria-hidden="true">Mission control // flight deck</div>
          <p class="eyebrow">Space exploration quiz</p>
          <h1 id="question">Loading question...</h1>
          <div class="options" id="options"></div>
          <div class="feedback" id="feedback" role="status"></div>
          <div class="next-row"><button class="primary hidden" id="next" type="button">Next question →</button></div>
        </div>
      </div>
      <div id="results-view" class="results hidden">
        <span class="results-emoji" id="result-emoji">🚀</span>
        <p class="eyebrow">Mission complete</p>
        <h2 id="result-title">Stellar work!</h2>
        <p id="result-copy"></p>
        <div class="score-card"><strong id="final-score">0</strong><span>/ <span id="question-total">10</span> correct</span></div>
        <h3 class="review-heading">Answer review</h3>
        <ol class="answer-review" id="answer-review" aria-label="Answer review"></ol>
        <br>
        <button class="primary" id="restart" type="button">Play again ↻</button>
      </div>
    </section>
  </main>
  <script>
    const questions = [
      { q: "Which planet is known as the Red Planet?", a: ["Venus", "Mars", "Jupiter", "Mercury"], correct: 1 },
      { q: "What is the name of our galaxy?", a: ["Andromeda", "Whirlpool", "Milky Way", "Sombrero"], correct: 2 },
      { q: "Which was the first human-made object to reach space?", a: ["V-2 rocket", "Sputnik 1", "Apollo 11", "Voyager 1"], correct: 0 },
      { q: "How long does light from the Sun take to reach Earth?", a: ["About 8 minutes", "About 8 hours", "About 1 second", "About 1 day"], correct: 0 },
      { q: "What do astronauts wear outside a spacecraft?", a: ["A flight suit", "A pressure suit", "A wetsuit", "A thermal cloak"], correct: 1 },
      { q: "Which planet has the most prominent ring system?", a: ["Neptune", "Saturn", "Uranus", "Earth"], correct: 1 },
      { q: "What is the name of NASA's rover that landed on Mars in 2021?", a: ["Curiosity", "Spirit", "Perseverance", "Opportunity"], correct: 2 },
      { q: "A light-year measures what?", a: ["Time", "Brightness", "Distance", "Temperature"], correct: 2 },
      { q: "What force keeps planets in orbit around the Sun?", a: ["Magnetism", "Gravity", "Friction", "Solar wind"], correct: 1 },
      { q: "Which telescope launched in 2021 to study the early universe?", a: ["Hubble", "Kepler", "Spitzer", "James Webb"], correct: 3 }
    ];

    let current = 0;
    let score = 0;
    let answered = false;
    let selectedAnswers = [];
    const $ = (id) => document.getElementById(id);

    function renderQuestion() {
      const item = questions[current];
      answered = false;
      $("question").textContent = item.q;
      $("question-count").textContent = `Question ${current + 1} of ${questions.length}`;
      $("percent").textContent = `${Math.round(((current + 1) / questions.length) * 100)}%`;
      $("progress-bar").style.width = `${((current + 1) / questions.length) * 100}%`;
      document.querySelector(".progress-track").setAttribute("aria-valuemax", questions.length);
      document.querySelector(".progress-track").setAttribute("aria-valuenow", current + 1);
      $("feedback").textContent = "";
      $("feedback").className = "feedback";
      $("next").classList.add("hidden");
      $("options").innerHTML = item.a.map((answer, index) =>
        `<button class="option" type="button" data-index="${index}"><span class="letter">${String.fromCharCode(65 + index)}</span><span>${answer}</span></button>`
      ).join("");
      document.querySelectorAll(".option").forEach((button) => button.addEventListener("click", () => choose(Number(button.dataset.index))));
    }

    function choose(index) {
      if (answered) return;
      answered = true;
      const item = questions[current];
      selectedAnswers[current] = index;
      const buttons = [...document.querySelectorAll(".option")];
      buttons.forEach((button) => button.disabled = true);
      buttons[item.correct].classList.add("correct");
      if (index === item.correct) {
        score++;
        $("score").textContent = score;
        $("feedback").textContent = "Correct! Your mission is on course. ✨";
        $("feedback").className = "feedback correct";
      } else {
        buttons[index].classList.add("wrong");
        $("feedback").textContent = `Not quite — the answer is ${item.a[item.correct]}.`;
        $("feedback").className = "feedback wrong";
      }
      $("next").textContent = current === questions.length - 1 ? "See results →" : "Next question →";
      $("next").classList.remove("hidden");
    }

    function showResults() {
      $("quiz-view").classList.add("hidden");
      $("results-view").classList.remove("hidden");
      $("final-score").textContent = score;
      $("question-total").textContent = questions.length;
      const ratio = score / questions.length;
      $("result-emoji").textContent = ratio === 1 ? "🏆" : ratio >= .7 ? "🚀" : ratio >= .4 ? "🌙" : "🛰️";
      $("result-title").textContent = ratio === 1 ? "Perfect orbit!" : ratio >= .7 ? "Stellar work!" : ratio >= .4 ? "Nice mission!" : "Keep exploring!";
      $("result-copy").textContent = ratio === 1 ? "You navigated every question like a true space commander." : "Every great explorer keeps learning. Ready for another launch?";
      $("answer-review").innerHTML = questions.map((item, index) => {
        const playerAnswer = selectedAnswers[index];
        const isCorrect = playerAnswer === item.correct;
        return `
          <li class="review-item ${isCorrect ? "correct" : "incorrect"}">
            <span class="review-status">${isCorrect ? "Correct" : "Incorrect"}</span>
            <p class="review-question">${index + 1}. ${item.q}</p>
            <p class="review-answer">Your answer: <strong>${item.a[playerAnswer]}</strong></p>
            <p class="review-answer">Correct answer: <strong>${item.a[item.correct]}</strong></p>
          </li>
        `;
      }).join("");
    }

    $("next").addEventListener("click", () => current === questions.length - 1 ? showResults() : (current++, renderQuestion()));
    $("restart").addEventListener("click", () => {
      current = 0;
      score = 0;
      selectedAnswers = [];
      $("score").textContent = "0";
      $("answer-review").innerHTML = "";
      $("results-view").classList.add("hidden");
      $("quiz-view").classList.remove("hidden");
      renderQuestion();
    });
    renderQuestion();
  </script>
</body>
</html>
